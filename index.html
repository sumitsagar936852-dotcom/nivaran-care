function home(){return `<section class="hero"><div class="wrap hero-grid"><div><p class="eyebrow">PREMIUM PAPER ESSENTIALS</p><h1>Everyday comfort.<br><i>Everyday care.</i></h1><p class="lead">Thoughtfully made tissues, napkins and rolls for cleaner, more comfortable everyday living.</p><a class="btn" href="#shop">Shop the collection</a></div><div class="hero-photo"><img src="${assets.facial}" alt="Nivaran Care facial tissues"><div class="float-card"><b>Soft. Hygienic. Dependable.</b><span>Made for everyday care</span></div></div></div></section><section class="wrap intro" id="about"><p class="eyebrow">THE NIVARAN STANDARD</p><h2>Care in every sheet.</h2><p>Practical paper essentials, made with a little more thought. For homes, workplaces, hospitality and everyday moments that matter.</p><div class="benefits"><div>âœ¦<b>Virgin pulp</b><span>Clean quality you can trust.</span></div><div>âŒ<b>Super soft</b><span>Gentle comfort, every day.</span></div><div>â—‰<b>Highly absorbent</b><span>Ready for lifeâ€™s little spills.</span></div><div>â™²<b>Hygienic & safe</b><span>Made for simple, clean living.</span></div></div></section><section class="collection"><div class="wrap"><div class="section-head"><div><p class="eyebrow">SHOP NIVARAN CARE</p><h2>Made for every room.</h2></div><a href="#shop">View all products â†’</a></div><div class="product-grid">${products.slice(0,3).map(card).join('')}</div></div></section><section class="wrap business"><div><p class="eyebrow">BULK & DISTRIBUTION</p><h2>Bring Nivaran Care to your shelves.</h2></div><p>For retail, hospitality, offices and bulk orders, our team is ready to help.</p><a class="btn light" href="#checkout">Make an enquiry</a></section>`}
function shop(){return `<section class="wrap page"><p class="eyebrow">OUR COLLECTION</p><h1 class="page-title">Everyday essentials,<br>beautifully made.</h1><p class="lead">Choose products that fit your home, business and routine.</p><div class="product-grid all-products">${products.map(card).join('')}</div></section>`}
function product(id){let p=products.find(x=>x.id===id)||products[0];return `<section class="wrap page"><div class="detail"><div>${img(p).replace('<img','<img class="detail-image"')}</div><div><p class="eyebrow">NIVARAN CARE Â· ${p.tag.toUpperCase()}</p><h1>${p.name}</h1><div class="price">â‚¹${p.price}</div><p>${p.desc} Nivaran Care products are made for simple, hygienic everyday living.</p><ul><li>Soft and comfortable to use</li><li>Hygienic, dependable quality</li><li>Suitable for home and professional use</li></ul><div class="qty"><label>Quantity</label><input type="number" min="1" value="1" id="qty"></div><button class="btn" onclick="add('${p.id}')">Add to cart</button></div></div></section>`}
function add(id){let c=cart(),q=+document.querySelector('#qty').value||1,f=c.find(x=>x.id===id);if(f)f.qty+=q;else c.push({id,qty:q});localStorage.setItem('nivaranCart',JSON.stringify(c));location.hash='cart'}
function cartPage(){let c=cart();if(!c.length)return `<section class="wrap page"><p class="eyebrow">YOUR ORDER</p><h1 class="page-title">Shopping cart</h1><div class="empty">Your cart is empty. <a href="#shop"><b>Start shopping â†’</b></a></div></section>`;let total=0,rows=c.map(x=>{let p=products.find(y=>y.id===x.id);total+=p.price*x.qty;return `<div class="cart-row">${img(p)}<div><h3>${p.name}</h3><p>â‚¹${p.price} Ã— ${x.qty}</p></div><a class="remove" href="#cart" onclick="removeItem('${p.id}')">Remove</a></div>`}).join('');return `<section class="wrap page"><p class="eyebrow">YOUR ORDER</p><h1 class="page-title">Shopping cart</h1>${rows}<div class="cart-summary"><b>Estimated total: â‚¹${total}</b><a class="btn" href="#checkout">Proceed to checkout</a></div></section>`}
function removeItem(id){localStorage.setItem('nivaranCart',JSON.stringify(cart().filter(x=>x.id!==id)));render()}
function checkout(){return `<section class="wrap page"><p class="eyebrow">PLACE YOUR ORDER</p><h1 class="page-title">A few details, then youâ€™re done.</h1><div class="checkout"><form onsubmit="placeOrder(event)"><label>Full name<input required name="name" placeholder="Your name"></label><label>Mobile / WhatsApp number<input required name="phone" placeholder="Your number"></label><label>Email address<input type="email" name="email" placeholder="name@example.com"></label><label>Delivery address<textarea required name="address" placeholder="House / building, street, city, PIN code"></textarea></label><label>Order notes (optional)<textarea name="notes" placeholder="Quantity or any other request"></textarea></label><button class="btn" type="submit">Place order enquiry</button></form><aside class="order-note"><h3>What happens next?</h3><p>Your details will be sent to our sales team through WhatsApp. They will confirm price, availability and delivery.</p><p><b>Important:</b> Replace the demo WhatsApp number in the code with your own number before publishing.</p></aside></div></section>`}
function placeOrder(e){e.preventDefault();let f=new FormData(e.target),order=cart().map(x=>{let p=products.find(y=>y.id===x.id);return p.name+' Ã— '+x.qty}).join(', ')||f.get('notes')||'General enquiry',t=`Hello Nivaran Care,%0A%0AI would like to place an order enquiry.%0AName: ${f.get('name')}%0APhone: ${f.get('phone')}%0AEmail: ${f.get('email')}%0AAddress: ${f.get('address')}%0AProducts: ${order}`;window.open('https://wa.me/919999999999?text='+t,'_blank')}
function render(){let route=location.hash.slice(1)||'home',view=route.startsWith('product/')?product(route.split('/')[1]):route==='shop'?shop():route==='cart'?cartPage():route==='checkout'?checkout():home();document.querySelector('#app').innerHTML=view;header();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
</script></body></html>
