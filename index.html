<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nivaran Care · Everyday Comfort. Everyday Care.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10264a;--bg:#faf7f0;--paper:#fff;--mute:#5b6b82;--line:#e6e1d4;--gold:#c9a24f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eaf0fa;--bg:#0d1626;--paper:#14213a;--mute:#9fb0c9;--line:#223250}}
:root[data-theme="dark"]{--ink:#eaf0fa;--bg:#0d1626;--paper:#14213a;--mute:#9fb0c9;--line:#223250}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Manrope,Arial,sans-serif;padding-bottom:84px}
a{color:inherit;text-decoration:none}h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.08}
.wrap{width:min(1140px,90%);margin:auto}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;height:74px;gap:10px}
.logo{font:800 22px Fraunces,serif;letter-spacing:1px}.logo b{color:var(--gold)}
.nav{display:flex;gap:22px;font-weight:600;font-size:14px}.nav a:hover{color:var(--gold)}
.acts{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);border-radius:30px;padding:8px 14px;font:700 13px Manrope;color:var(--ink);background:var(--paper);cursor:pointer}
.pill:hover{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);border:0;border-radius:40px;padding:14px 26px;font:800 15px Manrope;cursor:pointer;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}.btn.w{background:#fff;color:var(--th,#14305c)}.btn.g{background:var(--gold);color:#1a1a1a}.btn.wa{background:#1fa855;color:#fff}
.hero{color:#fff;transition:background-color .9s;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(700px 420px at 80% 30%,#ffffff26,transparent 65%)}
.hg{position:relative;display:grid;grid-template-columns:1fr 1.05fr;gap:44px;align-items:center;padding:56px 0 60px}
.hero h1{font-size:clamp(40px,6.4vw,84px);font-weight:800;letter-spacing:-1.5px;animation:up .9s both}
.hero .sub{font-size:18px;max-width:440px;opacity:.88;margin:20px 0 28px;animation:up .9s .12s both}
.row{display:flex;gap:12px;flex-wrap:wrap;animation:up .9s .24s both}
.ths{display:flex;gap:10px;margin-top:34px}.ths button{width:58px;height:58px;border-radius:16px;border:3px solid transparent;padding:0;overflow:hidden;cursor:pointer;opacity:.65;transition:.3s;background:none}
.ths button.on{border-color:#fff;opacity:1;transform:translateY(-4px)}.ths img{width:100%;height:100%;object-fit:cover;display:block}
.hp{position:relative;display:block;animation:up 1s .1s both}
.hp img{width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:26px;display:block;box-shadow:0 40px 70px #0007;transition:opacity .3s,transform .6s}
.hp:hover img{transform:scale(1.015)}
.chip{position:absolute;left:16px;bottom:16px;background:#fff;color:#10264a;border-radius:30px;padding:9px 16px;font-weight:800;font-size:14px}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.trust{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.trust div{padding:22px 16px;text-align:center;font-weight:700;font-size:14px;border-right:1px solid var(--line)}.trust div:last-child{border:0}
.sec{padding:80px 0}.sec h2{font-size:clamp(32px,4.6vw,54px);font-weight:800;letter-spacing:-1px;margin-bottom:10px}
.lead{color:var(--mute);max-width:540px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:36px}
.card{background:var(--paper);border-radius:22px;overflow:hidden;border:1px solid var(--line);border-top:6px solid var(--th);display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 44px #10264a22}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.im{display:block;overflow:hidden}.card img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}.card:hover img,.card:active img{transform:scale(1.12) rotate(2deg)}
.inf{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;flex:1}.inf small{color:var(--th);font-weight:800;font-size:13px}.inf h3{font-size:24px}.inf p{margin:0;color:var(--mute);font-size:14px;flex:1}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:800}
.add{background:var(--th);color:#fff;border:0;border-radius:30px;padding:9px 16px;font:800 13px Manrope;cursor:pointer}
.find{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:36px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.chips button{border:2px solid var(--line);background:none;color:var(--ink);border-radius:30px;padding:11px 20px;font:700 15px Manrope;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.res{display:flex;gap:12px;flex-wrap:wrap}.res a{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:8px 16px 8px 8px;font-weight:700;border-left:5px solid var(--th)}.res img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.bulk{background:var(--ink);color:var(--bg);border-radius:28px;padding:48px;display:grid;grid-template-columns:1fr 1fr;gap:36px}
.bulk .lead{color:inherit;opacity:.75}
form label{display:block;font-weight:700;font-size:13px}
input,select,textarea{width:100%;margin:6px 0 14px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:15px Manrope}
.cl{display:grid;grid-template-columns:1.15fr .9fr;gap:28px;align-items:start}.mnav{display:none;gap:20px;justify-content:center;padding:8px 0;font-weight:700;font-size:14px;border-top:1px solid var(--line)}.pg{padding:50px 0 80px;min-height:60vh}.pg h1{font-size:clamp(36px,5.4vw,64px);font-weight:800;margin-bottom:12px}
.ph{color:#fff;transition:none}.det{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding:48px 0}
.det img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:26px;box-shadow:0 36px 60px #0006}
.det h1{font-size:clamp(38px,5.4vw,66px);font-weight:800}.price{font:800 38px Fraunces,serif;margin:14px 0}
.stp{display:inline-flex;align-items:center;border:2px solid #ffffff88;border-radius:40px;margin:6px 0 20px}.stp button{background:none;border:0;color:#fff;font:800 22px Manrope;width:46px;height:46px;cursor:pointer}.stp span{min-width:34px;text-align:center;font-weight:800}
.bn{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px}.bn div{border:1px solid var(--line);border-left:5px solid var(--th);border-radius:14px;padding:18px;font-weight:700;background:var(--paper)}
.rw{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0}.rw img{width:90px;height:68px;object-fit:cover;border-radius:10px}
.sm{display:flex;gap:6px;align-items:center}.sm button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-weight:800;cursor:pointer}
.sum{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--paper);border-radius:16px;padding:22px;margin-top:18px;border:1px solid var(--line)}
.box{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px;max-width:560px}
.ft{background:var(--ink);color:var(--bg);padding:30px 0;font-size:14px}.ft .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 12px 30px #0005}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:30px;font-weight:700;transition:transform .4s;z-index:50}.toast.on{transform:translate(-50%,0)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media(max-width:820px){.cl{grid-template-columns:1fr}.hg,.det,.bulk{grid-template-columns:1fr}.grid,.bn{grid-template-columns:1fr}.trust{grid-template-columns:1fr 1fr}.trust div:nth-child(2){border:0}.nav{gap:14px}.bulk{padding:28px}.hp{order:-1}.hero h1{font-size:44px}.logo{font-size:18px}.rw{grid-template-columns:70px 1fr}.rw img{width:70px;height:56px}}
@media(max-width:560px){.nav,.pl{display:none}.mnav{display:flex}.rw{grid-template-columns:70px 1fr auto}.logo img{height:44px!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

function addQ(id,n,go){const c=cart(),f=c.find(x=>x.id===id);f?f.q+=n:c.push({id,q:n});sv('nvc',c);toast('Added to cart');hdr();if(go)location.hash='cart'}
function chg(id,d){let c=cart();c.forEach(x=>{if(x.id===id)x.q+=d});c=c.filter(x=>x.q>0);sv('nvc',c);render()}
function cartRows(){const c=cart();let tot=0,n=0;const rows=c.map(x=>{const g=gp(x.id);tot+=g.p*x.q;n+=x.q;return `<div class="rw"><img src="${PHOTOS[g.id]}" alt=""><div><b>${g.n}</b><br><span style="color:var(--mute)">${R}${g.p} ${t('each')}</span></div><div style="text-align:right"><div class="sm"><button onclick="chg('${g.id}',-1)" aria-label="Less">&minus;</button><b>${x.q}</b><button onclick="chg('${g.id}',1)" aria-label="More">+</button></div><div style="font-weight:800;margin-top:6px">${R}${g.p*x.q}</div></div></div>`}).join('');return rows+`<div class="sum"><span>${t('ti')}: <b>${n}</b></span><b style="font-size:22px">${t('tt')}: ${R}${tot}</b></div>`}
function cartPg(){const c=cart(),p=ld('nvp')||{};if(!c.length)return `<section class="wrap pg"><h1>${t('cart')}</h1><div class="box">${t('em')} <a href="#shop"><b>${t('b1')}</b></a></div></section>`;return `<section class="wrap pg"><h1>${t('cart')}</h1><div class="cl"><div id="cr">${cartRows()}</div><form class="box" onsubmit="place(event)"><h3 style="font-size:26px;margin-bottom:14px">${t('dd')}</h3><label>${t('nm')}<input required name="name" value="${esc(p.name)}"></label><label>${t('mb')}<input required name="phone" inputmode="tel" value="${esc(p.phone)}"></label><label>${t('ad')}<textarea required name="address" rows="3">${esc(p.address)}</textarea></label><label>${t('nt')}<textarea name="notes" rows="2"></textarea></label><button class="btn wa" style="width:100%" type="submit">${t('wa')}</button><p style="color:var(--mute);font-size:13px">${t('sn')}</p></form></div></section>`}
function chg(id,d){let c=cart();c.forEach(x=>{if(x.id===id)x.q+=d});c=c.filter(x=>x.q>0);sv('nvc',c);if(!c.length)render();else{document.getElementById('cr').innerHTML=cartRows();hdr()}}
function place(e){e.preventDefault();const f=new FormData(e.target);sv('nvp',{name:f.get('name'),phone:f.get('phone'),address:f.get('address')});let tot=0,n=0;const o=cart().map(x=>{const g=gp(x.id);tot+=g.p*x.q;n+=x.q;return g.n+' x '+x.q+' = '+R+g.p*x.q}).join('\n')||'General enquiry';window.open(wl(`Hello Nivaran Care, order request.\nName: ${f.get('name')}\nPhone: ${f.get('phone')}\nAddress: ${f.get('address')}\n\nProducts:\n${o}\nTotal items: ${n}\nTotal: ${R}${tot}\nNotes: ${f.get('notes')||'-'}`),'_blank');hdr()}
function profilePg(){const p=ld('nvp')||{};return `<section class="wrap pg"><h1>${t('prof')}</h1><p class="lead">${t('pd')}</p><form class="box" style="margin-top:22px" onsubmit="saveP(event)"><label>${t('nm')}<input required name="name" value="${esc(p.name)}"></label><label>${t('mb')}<input required name="phone" inputmode="tel" value="${esc(p.phone)}"></label><label>${t('ad')}<textarea required name="address" rows="3">${esc(p.address)}</textarea></label><button class="btn" type="submit">${t('sv')}</button></form>${p.name?`<p><button class="pill" onclick="clrP()">Clear saved details</button></p>`:''}</section>`}
function saveP(e){e.preventDefault();const f=new FormData(e.target);sv('nvp',{name:f.get('name'),phone:f.get('phone'),address:f.get('address')});toast('Details saved');render()}
function clrP(){try{localStorage.removeItem('nvp')}catch(e){}render()}
function render(){clearInterval(tm);const r=location.hash.slice(1)||'home';const v=r.startsWith('product/')?product(r.split('/')[1]):({shop,cart:cartPg,checkout:cartPg,bulk:bulkPg,profile:profilePg}[r]||home)();document.getElementById('app').innerHTML=v;hdr();window.scrollTo(0,0);if(document.getElementById('hero')&&!matchMedia('(prefers-reduced-motion:reduce)').matches)tm=setInterval(()=>heroSet((hi+1)%P.length),5200);hi=0}
addEventListener('hashchange',render);render();
</script></body></html>
